<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Jake Evans News</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Social Sharing Meta -->
  <meta property="og:title" content="Jake Evans News – Civic Preparation for Neosho">
  <meta property="og:description" content="Plain-English guides to the Charter, City Code, Council meetings, and civic participation in Neosho.">
  <meta property="og:image" content="https://jakeevansnews.com/assets/images/city-hall.jpg">
  <meta property="og:url" content="https://jakeevansnews.com/">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="stylesheet" href="/css/style.css">

  <!-- Favicon Setup -->
  <link rel="icon" href="/assets/favicons/favicon.ico" />
  <link rel="icon" type="image/png" sizes="96x96" href="/assets/favicons/favicon-96x96.png" />
  <link rel="icon" type="image/svg+xml" href="/assets/favicons/favicon.svg" />
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicons/apple-touch-icon.png" />
  <link rel="manifest" href="/assets/favicons/site.webmanifest" />
</head>
<body class="jenews-home">
  <div class="jenews-wrap">

    <!-- Dynamic Header -->
    <div id="site-header"></div>

    <img src="/assets/images/city-hall_2.jpg" alt="City Hall" class="centered-photo">  

        <div class="jenews-mini" aria-hidden="true">
          <a class="jenews-link" href="/pages/preparing-to-serve/">          
            <p class="jenews-kicker">News</p>
            <h3 class="jenews-headline">Preparing to Serve</h3>
            <p class="jenews-deck">Short, practical posts explaining how I prepare to participate responsibly in local government.</p>
          </a>  
        </div>

      </aside>
    </main>

    <!-- Dynamic Footer -->
    <div id="site-footer"></div>

  </div>  

  <!-- Load Header + Footer -->
  <script>
    function loadHTML(id, url) {
      fetch(url)
        .then(res => res.text())
        .then(html => {
          document.getElementById(id).innerHTML = html;
        });
    }

    loadHTML('site-header', '/partials/header.html');
    loadHTML('site-footer', '/partials/footer.html');
  </script>

  <!-- Dropdown + Mobile Nav JS -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('a.jenews-link, a.jenews-pill').forEach(link => {
        link.setAttribute('target', '_self');
      });

      document.querySelectorAll('.jenews-nav li').forEach(li => {
        let timer;
        const submenu = li.querySelector('ul');

        if (submenu) {
          li.addEventListener('mouseenter', () => {
            clearTimeout(timer);
            submenu.style.display = 'flex';
          });

          li.addEventListener('mouseleave', () => {
            timer = setTimeout(() => {
              submenu.style.display = 'none';
            }, 300);
          });

          submenu.addEventListener('mouseenter', () => {
            clearTimeout(timer);
          });

          submenu.addEventListener('mouseleave', () => {
            timer = setTimeout(() => {
              submenu.style.display = 'none';
            }, 300);
          });
        }
      });
    });
  </script>
</body>
</html>
